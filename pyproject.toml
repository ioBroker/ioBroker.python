# The environment py-controller builds for this adapter is resolved from here
# (doc/PYTHON.md: dependencyHash is a hash over this file).
#
# Deliberately only the SDK: a logic host that drags a dependency tree into every
# installation is a host nobody wants on a Raspberry Pi. Cron parsing is ~50 lines
# and lives in scheduler.py rather than costing a package.

[project]
name = "iobroker-python-adapter"
version = "0.0.1"
description = "ioBroker adapter that runs Python logic scripts"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["iobroker>=0.5.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["test"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
