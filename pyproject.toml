# Tooling configuration only. The adapter's Python package -- its dependencies and how it is
# built -- lives in python/pyproject.toml, where py-controller expects it.
#
# The settings below are relative to this file, which is why they stay in the repository root:
# pytest and ruff are run from here.

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["test"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Logic scripts are executed with `on`, `schedule`, `set_state`, `log` and friends already in
# their namespace, so a linter reading them as standalone files sees undefined names. Scoped to
# the examples rather than set as global `builtins`, which would hide real mistakes in the
# adapter's own code.
"examples/*" = ["F821"]
