<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Python scripts</title>

        <!--
            The two scripts admin serves to every adapter page, in the order ioBroker.javascript's
            own tab loads them: info.js publishes where the socket lives (window.socketUrl and
            friends), socket.io.js is the client AdminConnection then uses.
        -->
        <script type="text/javascript" src="_socket/info.js"></script>
        <script>
            const script = document.createElement('script');
            window.registerSocketOnLoad = function (cb) {
                window.socketLoadedHandler = cb;
            };
            script.onload = function () { typeof window.socketLoadedHandler === 'function' && window.socketLoadedHandler(); };
            setTimeout(() => {
                script.src = window.location.port.startsWith('300') ? `${window.location.protocol}//${window.location.hostname}:8081/lib/js/socket.io.js` : '../../lib/js/socket.io.js';
            }, 1000);

            document.head.appendChild(script);
        </script>

        <style>
            html,
            body,
            #root {
                height: 100%;
                margin: 0;
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/index.tsx"></script>
    </body>
</html>
